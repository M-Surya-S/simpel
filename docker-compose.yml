services:
  mysql:
    image: mysql:8.0
    container_name: simpel_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: simpel
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - simpel_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mysql_data:
    driver: local

networks:
  simpel_network:
    driver: bridge
